name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./dist/linux/boilerplate-cli-ui-dotnet version

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./dist/linux/boilerplate-cli-ui-dotnet version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
