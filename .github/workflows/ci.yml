name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./dist/linux/boilerplate-cli-ui-dotnet version


      # The boilerplates are comparison instruments: they must all implement the
      # same contract, or comparing their binary sizes is meaningless. This
      # proves it instead of asserting it.
      - name: Install machin (for the conformance harness)
        run: curl -fsSL https://raw.githubusercontent.com/javimosch/machin/main/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build the conformance harness
        run: |
          git clone --depth 1 https://github.com/javimosch/cli-spec-conformance /tmp/csc
          (cd /tmp/csc && ./build.sh)

      - name: Spec conformance
        run: /tmp/csc/cli-spec-conformance check ./dist/linux/boilerplate-cli-ui-dotnet --specs output,guide,daemon

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./dist/linux/boilerplate-cli-ui-dotnet version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
